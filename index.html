<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperframe — Caroselli immobili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F172A;
    --navy2:#1E293B;
    --gold:#D97706;
    --gold2:#B45309;
    --paper:#F8FAFC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--navy);
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:24px 28px;
  }
  header h1{
    margin:0 0 4px;
    font-family:'Playfair Display',serif;
    font-size:24px;
  }
  header p{margin:0;color:#CBD5E1;font-size:14px;}

  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:0;
    align-items:start;
  }
  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    padding:24px;
    background:#fff;
    border-right:1px solid #E2E8F0;
    min-height:calc(100vh - 88px);
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:#475569;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .field input[type=text],
  .field input[type=number],
  .field textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid #CBD5E1;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
  }
  .field textarea{resize:vertical;min-height:90px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .photo-slot{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border:1px dashed #CBD5E1;
    border-radius:8px;
    margin-bottom:8px;
    font-size:13px;
  }
  .photo-slot img{
    width:44px;height:44px;object-fit:cover;border-radius:6px;background:#E2E8F0;
  }
  .photo-slot .ph-label{flex:1;color:#475569;}
  .photo-slot input[type=file]{font-size:12px;max-width:150px;}

  .btns{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
  }
  button.primary,button.secondary{
    border:none;
    border-radius:8px;
    padding:12px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  button.primary{background:var(--gold);color:#1a1200;}
  button.primary:hover{background:var(--gold2);}
  button.secondary{background:var(--navy);color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  #status{font-size:12px;color:#475569;margin-top:8px;min-height:16px;}

  .stage{
    padding:28px;
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    justify-content:flex-start;
  }

  .slide-preview{
    width:300px;
    height:375px;
    overflow:hidden;
    position:relative;
    border-radius:10px;
    box-shadow:0 8px 24px rgba(15,23,42,.18);
    background:#111;
  }
  .slide-preview .scaler{
    width:1080px;
    height:1350px;
    transform:scale(0.27778);
    transform-origin:top left;
  }
  .slide-name{
    text-align:center;
    font-size:12px;
    color:#64748B;
    margin-top:8px;
    font-weight:600;
  }
  .slide-card{display:flex;flex-direction:column;align-items:center;}

  /* ---- Slide (1080x1350) base ---- */
  .slide{
    width:1080px;
    height:1350px;
    position:relative;
    background:var(--navy);
    overflow:hidden;
    font-family:'Inter',sans-serif;
  }
  .slide .bgphoto{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
  }
  .slide .bgphoto.placeholder{
    background:linear-gradient(135deg,#1E293B,#0F172A);
  }
  .slide .overlay-bottom{
    position:absolute;left:0;right:0;bottom:0;height:60%;
    background:linear-gradient(180deg,rgba(15,23,42,0) 0%,rgba(15,23,42,.55) 45%,rgba(15,23,42,.96) 100%);
  }
  .slide .badge{
    position:absolute;top:70px;left:70px;right:70px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:2px;
    color:var(--gold);
    text-transform:uppercase;
    z-index:2;
  }
  .slide .bottom-stack{
    position:absolute;left:70px;right:70px;bottom:90px;z-index:2;
  }
  .slide .address{
    font-size:38px;font-weight:600;color:#fff;margin-bottom:20px;
  }
  .slide .price-pill{
    display:inline-flex;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    border-radius:20px;
    padding:18px 34px;
    box-shadow:0 16px 32px rgba(217,119,6,.35);
  }
  .slide .price-pill span{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:68px;
    color:var(--navy);
    line-height:1;
  }
  .slide .tag{
    position:absolute;top:70px;right:70px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    font-size:22px;
    font-weight:600;
    padding:10px 20px;
    border-radius:999px;
    z-index:2;
  }

  /* Slide 2: caratteristiche */
  .slide2 .photobox{
    position:absolute;top:0;left:0;right:0;height:56%;
  }
  .slide2 .panelbox{
    position:absolute;left:0;right:0;bottom:0;top:56%;
    background:#fff;
    padding:60px 70px;
  }
  .slide2 h2{
    font-family:'Playfair Display',serif;
    font-size:46px;
    margin:0 0 30px;
    color:var(--navy);
  }
  .slide2 .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:24px;
  }
  .slide2 .stat{
    background:var(--paper);
    border-left:6px solid var(--gold);
    border-radius:10px;
    padding:22px 24px;
  }
  .slide2 .stat .num{
    font-family:'Playfair Display',serif;
    font-size:40px;font-weight:800;color:var(--navy);
  }
  .slide2 .stat .lbl{
    font-size:18px;color:#475569;font-weight:600;margin-top:4px;
  }

  /* Slide 3: punti di forza */
  .slide3{display:flex;flex-direction:column;justify-content:center;padding:100px 90px;}
  .slide3 .deco{
    position:absolute;top:-120px;right:-120px;width:420px;height:420px;
    border-radius:50%;background:rgba(217,119,6,.12);
  }
  .slide3 h2{
    font-family:'Playfair Display',serif;
    font-size:56px;color:#fff;margin:0 0 50px;z-index:2;position:relative;
  }
  .slide3 ul{list-style:none;margin:0;padding:0;z-index:2;position:relative;}
  .slide3 li{
    display:flex;align-items:flex-start;gap:20px;
    font-size:32px;color:#E2E8F0;margin-bottom:34px;line-height:1.3;
  }
  .slide3 li .dot{
    flex:none;width:44px;height:44px;border-radius:50%;
    background:var(--gold);color:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:22px;
  }

  /* Slide 4: contatto */
  .slide4{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:100px 90px;
    background:linear-gradient(160deg,var(--navy),#1a2744);
  }
  .slide4 .agency{
    font-family:'Inter',sans-serif;font-weight:700;font-size:34px;
    color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:28px;
  }
  .slide4 h2{
    font-family:'Playfair Display',serif;color:#fff;font-size:58px;margin:0 0 20px;
  }
  .slide4 .sub{color:#CBD5E1;font-size:28px;margin-bottom:60px;}
  .slide4 .agent{
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .slide4 .agent-name{color:#fff;font-size:36px;font-weight:700;}
  .slide4 .agent-contact{color:#CBD5E1;font-size:26px;}
  .slide4 .cta{
    margin-top:50px;
    display:inline-flex;
    background:var(--gold);
    color:var(--navy);
    font-weight:700;font-size:30px;
    padding:22px 54px;border-radius:999px;
  }

  footer{
    text-align:center;
    color:#94A3B8;
    font-size:12px;
    padding:20px;
  }
</style>
</head>
<body>

<header>
  <h1>Hyperframe</h1>
  <p>Generatore di caroselli immagine per Instagram/Facebook — schede immobile pronte da pubblicare</p>
</header>

<div class="layout">
  <div class="panel">
    <div class="field">
      <label>Indirizzo immobile</label>
      <input type="text" id="hf-indirizzo" placeholder="Via Roma 12">
    </div>
    <div class="row2">
      <div class="field">
        <label>Comune / Zona</label>
        <input type="text" id="hf-comune" placeholder="Agropoli">
      </div>
      <div class="field">
        <label>Prezzo</label>
        <input type="text" id="hf-prezzo" placeholder="€ 185.000">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Superficie (m²)</label>
        <input type="number" id="hf-mq" placeholder="90">
      </div>
      <div class="field">
        <label>Locali</label>
        <input type="text" id="hf-locali" placeholder="3">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Piano</label>
        <input type="text" id="hf-piano" placeholder="2°, con ascensore">
      </div>
      <div class="field">
        <label>Tag (in copertina)</label>
        <input type="text" id="hf-tag" placeholder="Nuovo incarico">
      </div>
    </div>

    <div class="field">
      <label>Punti di forza (uno per riga)</label>
      <textarea id="hf-punti">Posizione centrale, a due passi dai servizi
Ottima esposizione e luminosità
Libero da subito, nessuna catena
Ideale prima casa o investimento</textarea>
    </div>

    <div class="field">
      <label>Agenzia</label>
      <input type="text" id="hf-agenzia" value="Frimm Capital Casa Paestum">
    </div>
    <div class="row2">
      <div class="field">
        <label>Agente</label>
        <input type="text" id="hf-agente" value="Enzo Carnicelli">
      </div>
      <div class="field">
        <label>Contatto (telefono/IG)</label>
        <input type="text" id="hf-contatto" placeholder="Scrivici in DM">
      </div>
    </div>

    <div class="field">
      <label>Foto (slide 1 e 2 — in ordine)</label>
      <div class="photo-slot">
        <img id="hf-ph-thumb-0" alt="">
        <span class="ph-label">Foto copertina</span>
        <input type="file" accept="image/*" data-slot="0">
      </div>
      <div class="photo-slot">
        <img id="hf-ph-thumb-1" alt="">
        <span class="ph-label">Foto caratteristiche</span>
        <input type="file" accept="image/*" data-slot="1">
      </div>
    </div>

    <div class="btns">
      <button class="secondary" id="btnAnteprima">Aggiorna anteprima</button>
      <button class="primary" id="btnScarica" disabled>Scarica caroselli (ZIP)</button>
      <div id="status"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="slide-card">
      <div class="slide-preview"><div class="scaler" id="prev-1"></div></div>
      <div class="slide-name">1 · Copertina</div>
    </div>
    <div class="slide-card">
      <div class="slide-preview"><div class="scaler" id="prev-2"></div></div>
      <div class="slide-name">2 · Caratteristiche</div>
    </div>
    <div class="slide-card">
      <div class="slide-preview"><div class="scaler" id="prev-3"></div></div>
      <div class="slide-name">3 · Punti di forza</div>
    </div>
    <div class="slide-card">
      <div class="slide-preview"><div class="scaler" id="prev-4"></div></div>
      <div class="slide-name">4 · Contatto</div>
    </div>
  </div>
</div>

<footer>Hyperframe — Frimm Capital Casa Paestum</footer>

<script>
(function(){
  var photos = [null, null]; // object URL (dal file picker) o URL remoto (precompilato)

  /* [10 nov 2026] Precompilazione da query string: il gestionale apre questa
     pagina con i dati dell'immobile già pronti (indirizzo, prezzo, foto...),
     niente da ricopiare a mano. Parametri: indirizzo, comune, prezzo, mq,
     locali, piano, tag, agenzia, agente, contatto, foto1, foto2. */
  function precompila(){
    var qs = new URLSearchParams(window.location.search);
    var map = {
      indirizzo:'hf-indirizzo', comune:'hf-comune', prezzo:'hf-prezzo',
      mq:'hf-mq', locali:'hf-locali', piano:'hf-piano', tag:'hf-tag',
      agenzia:'hf-agenzia', agente:'hf-agente', contatto:'hf-contatto'
    };
    var trovato = false;
    Object.keys(map).forEach(function(k){
      var v = qs.get(k);
      if(v){ document.getElementById(map[k]).value = v; trovato = true; }
    });
    [0,1].forEach(function(slot){
      var v = qs.get('foto'+(slot+1));
      if(v){
        photos[slot] = v;
        document.getElementById('hf-ph-thumb-'+slot).src = v;
        trovato = true;
      }
    });
    return trovato;
  }

  function esc(s){
    return (s||'').toString().replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function val(id){ return document.getElementById(id).value.trim(); }

  function buildSlide1(d){
    var photo = photos[0]
      ? '<img class="bgphoto" crossorigin="anonymous" src="'+photos[0]+'">'
      : '<div class="bgphoto placeholder"></div>';
    var tag = d.tag ? '<div class="tag">'+esc(d.tag)+'</div>' : '';
    return '<div class="slide slide1">'+photo+
      '<div class="overlay-bottom"></div>'+
      tag+
      '<div class="badge">'+esc(d.agenzia)+'</div>'+
      '<div class="bottom-stack">'+
        '<div class="address">'+esc(d.indirizzo)+(d.comune?(' · '+esc(d.comune)):'')+'</div>'+
        '<div class="price-pill"><span>'+esc(d.prezzo)+'</span></div>'+
      '</div>'+
    '</div>';
  }

  function buildSlide2(d){
    var photo = photos[1]
      ? '<img class="bgphoto" crossorigin="anonymous" src="'+photos[1]+'">'
      : '<div class="bgphoto placeholder"></div>';
    var stats = '';
    if(d.mq) stats += '<div class="stat"><div class="num">'+esc(d.mq)+' m²</div><div class="lbl">Superficie</div></div>';
    if(d.locali) stats += '<div class="stat"><div class="num">'+esc(d.locali)+'</div><div class="lbl">Locali</div></div>';
    if(d.piano) stats += '<div class="stat"><div class="num">'+esc(d.piano)+'</div><div class="lbl">Piano</div></div>';
    if(d.comune) stats += '<div class="stat"><div class="num">'+esc(d.comune)+'</div><div class="lbl">Zona</div></div>';
    return '<div class="slide slide2">'+
      '<div class="photobox">'+photo+'</div>'+
      '<div class="panelbox">'+
        '<h2>Caratteristiche</h2>'+
        '<div class="grid">'+stats+'</div>'+
      '</div>'+
    '</div>';
  }

  function buildSlide3(d){
    var items = (d.punti||[]).map(function(p,i){
      return '<li><span class="dot">'+(i+1)+'</span><span>'+esc(p)+'</span></li>';
    }).join('');
    return '<div class="slide slide3">'+
      '<div class="deco"></div>'+
      '<h2>Perché sceglierlo</h2>'+
      '<ul>'+items+'</ul>'+
    '</div>';
  }

  function buildSlide4(d){
    return '<div class="slide slide4">'+
      '<div class="agency">'+esc(d.agenzia)+'</div>'+
      '<h2>Ti interessa?</h2>'+
      '<div class="sub">Prenota una visita, senza impegno</div>'+
      '<div class="agent">'+
        '<div class="agent-name">'+esc(d.agente)+'</div>'+
        (d.contatto?'<div class="agent-contact">'+esc(d.contatto)+'</div>':'')+
      '</div>'+
      '<div class="cta">'+esc(d.contatto ? d.contatto : 'Scrivici in DM')+'</div>'+
    '</div>';
  }

  function collectData(){
    return {
      indirizzo: val('hf-indirizzo') || 'Indirizzo immobile',
      comune: val('hf-comune'),
      prezzo: val('hf-prezzo') || '€ —',
      mq: val('hf-mq'),
      locali: val('hf-locali'),
      piano: val('hf-piano'),
      tag: val('hf-tag'),
      punti: val('hf-punti').split('\n').map(function(s){return s.trim();}).filter(Boolean),
      agenzia: val('hf-agenzia') || 'Frimm Capital Casa Paestum',
      agente: val('hf-agente') || 'Enzo Carnicelli',
      contatto: val('hf-contatto')
    };
  }

  function renderPreview(){
    var d = collectData();
    document.getElementById('prev-1').innerHTML = buildSlide1(d);
    document.getElementById('prev-2').innerHTML = buildSlide2(d);
    document.getElementById('prev-3').innerHTML = buildSlide3(d);
    document.getElementById('prev-4').innerHTML = buildSlide4(d);
    document.getElementById('btnScarica').disabled = false;
  }

  document.getElementById('btnAnteprima').addEventListener('click', renderPreview);

  [0,1].forEach(function(slot){
    var input = document.querySelector('input[type=file][data-slot="'+slot+'"]');
    input.addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      var url = URL.createObjectURL(f);
      photos[slot] = url;
      document.getElementById('hf-ph-thumb-'+slot).src = url;
      renderPreview();
    });
  });

  /* ---- lazy-load html2canvas + jszip (stesso pattern del Kit Acquisizione) ---- */
  var _h2cP, _zipP;
  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src; s.crossOrigin = 'anonymous';
      s.onload = resolve; s.onerror = function(){ reject(new Error('Impossibile caricare '+src)); };
      document.head.appendChild(s);
    });
  }
  function h2cReady(){
    if (!_h2cP) _h2cP = (window.html2canvas) ? Promise.resolve() :
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    return _h2cP;
  }
  function zipReady(){
    if (!_zipP) _zipP = (window.JSZip) ? Promise.resolve() :
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    return _zipP;
  }

  function cattura(el){
    return window.html2canvas(el, {
      foreignObjectRendering: true,
      useCORS: true,
      backgroundColor: null,
      width: 1080,
      height: 1350
    }).catch(function(){
      return window.html2canvas(el, { useCORS:true, backgroundColor:null, width:1080, height:1350 });
    });
  }

  document.getElementById('btnScarica').addEventListener('click', function(){
    var btn = this, status = document.getElementById('status');
    btn.disabled = true;
    status.textContent = 'Preparazione librerie...';
    Promise.all([h2cReady(), zipReady()]).then(function(){
      status.textContent = 'Cattura slide 1/4...';
      var ids = ['prev-1','prev-2','prev-3','prev-4'];
      var names = ['01-copertina.png','02-caratteristiche.png','03-punti-di-forza.png','04-contatto.png'];
      var zip = new window.JSZip();
      var chain = Promise.resolve();
      ids.forEach(function(id, i){
        chain = chain.then(function(){
          status.textContent = 'Cattura slide '+(i+1)+'/4...';
          var slideEl = document.getElementById(id).querySelector('.slide');
          return cattura(slideEl).then(function(canvas){
            var dataUrl = canvas.toDataURL('image/png').split(',')[1];
            zip.file(names[i], dataUrl, {base64:true});
          });
        });
      });
      return chain.then(function(){
        status.textContent = 'Creazione ZIP...';
        return zip.generateAsync({type:'blob'});
      });
    }).then(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      var nome = (val('hf-indirizzo')||'immobile').replace(/[^a-zA-Z0-9]+/g,'-');
      a.download = 'Carosello-'+nome+'.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      status.textContent = 'Fatto! ZIP scaricato.';
      btn.disabled = false;
    }).catch(function(err){
      status.textContent = 'Errore: '+err.message;
      btn.disabled = false;
    });
  });

  var precompilato = precompila();
  renderPreview();
  if(precompilato) document.getElementById('status').textContent = 'Dati precompilati dal gestionale — controlla e scarica.';
})();
</script>

</body>
</html>
